<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Feedback | Railway Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Poppins', sans-serif; background: #0f0e17; color: white; min-height: 100vh; }
    .sidebar { position: fixed; top: 0; left: 0; width: 240px; height: 100vh; background: rgba(255,255,255,0.04); border-right: 1px solid rgba(255,255,255,0.08); padding: 28px 16px; z-index: 100; display: flex; flex-direction: column; }
    .sidebar-logo { display: flex; align-items: center; gap: 10px; padding: 10px 14px 24px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 20px; }
    .sidebar-logo .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg,#f7971e,#ffd200); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #1e293b; }
    .sidebar-logo span { font-weight: 800; font-size: 15px; }
    .nav-item-s { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: rgba(255,255,255,0.55); font-size: 14px; font-weight: 500; text-decoration: none; margin-bottom: 4px; transition: all 0.2s; }
    .nav-item-s:hover, .nav-item-s.active { background: rgba(247,151,30,0.12); color: #f7971e; }
    .nav-item-s i { font-size: 18px; width: 22px; text-align: center; }
    .main-content { margin-left: 240px; padding: 32px; min-height: 100vh; }
    .card-table { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 24px; }
    .table-dark { --bs-table-bg: transparent; color: rgba(255,255,255,0.85); }
</style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-logo">
        <div class="logo-icon"><i class="bi bi-train-front-fill"></i></div>
        <span>Rail Admin</span>
    </div>
    <a href="admin_dashboard.html" class="nav-item-s"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="manage_users.html" class="nav-item-s"><i class="bi bi-people-fill"></i> Users</a>
    <a href="manage_restaurants.html" class="nav-item-s"><i class="bi bi-shop"></i> Restaurants</a>
    <a href="manage_payments.html" class="nav-item-s"><i class="bi bi-credit-card-2-front"></i> Payments</a>
    <a href="manage_complaints.html" class="nav-item-s"><i class="bi bi-exclamation-triangle"></i> Complaints</a>
    <a href="manage_feedback.html" class="nav-item-s active"><i class="bi bi-chat-dots"></i> Feedback</a>
</div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">Passenger Feedback & Ratings</h2>
            <p class="text-white-50 small">Customer satisfaction ratings and journey reviews</p>
        </div>
    </div>

    <div class="card-table">
        <div class="table-responsive">
            <table class="table table-dark align-middle">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Passenger</th>
                        <th>Rating</th>
                        <th>Review</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="feedbackTbody">
                    <!-- Rendered by JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="data.js"></script>
<script>
    requireAdmin();
    const feedback = JSON.parse(localStorage.getItem('rf_feedback') || '[]');

    function renderFeedback() {
        const tbody = document.getElementById('feedbackTbody');
        if (feedback.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-white-50">No feedback reviews yet</td></tr>';
            return;
        }
        tbody.innerHTML = feedback.map(f => `
            <tr>
                <td>#${f.id}</td>
                <td><strong>${f.name || 'Passenger'}</strong><br><small class="text-white-50">${f.user_email}</small></td>
                <td class="text-warning">
                    ${'<i class="bi bi-star-fill"></i>'.repeat(f.rating || 5)}${'<i class="bi bi-star"></i>'.repeat(5 - (f.rating || 5))}
                </td>
                <td><small>${f.message}</small></td>
                <td><small class="text-white-50">${f.created_at || 'Recently'}</small></td>
                <td>
                    <button onclick="deleteFeed(${f.id})" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                </td>
            </tr>
        `).join('');
    }

    function deleteFeed(id) {
        if (confirm("Delete this feedback?")) {
            const idx = feedback.findIndex(item => item.id === id);
            if (idx !== -1) {
                feedback.splice(idx, 1);
                localStorage.setItem('rf_feedback', JSON.stringify(feedback));
                renderFeedback();
            }
        }
    }

    renderFeedback();
</script>

</body>
</html>
