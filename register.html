<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration | Railway Food Order</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
    body { background: linear-gradient(to right,#f7971e,#ffd200); min-height:100vh; display:flex; justify-content:center; align-items:center; padding: 20px; }
    .register-container { background:#fff; padding:40px; border-radius:15px; box-shadow:0 8px 20px rgba(0,0,0,0.2); width:100%; max-width:420px; }
    .register-box h2 { text-align:center; color:#333; margin-bottom:10px; font-size:26px; font-weight:700; }
    .register-box p { text-align:center; color:#777; margin-bottom:25px; font-size:14px; }
    .register-box input { width:100%; padding:12px 15px; margin-bottom:16px; border:1px solid #ddd; border-radius:8px; font-size:14px; transition:0.3s; }
    .register-box input:focus { border-color:#f7971e; outline:none; box-shadow:0 0 5px rgba(247,151,30,0.5); }
    .register-box button { width:100%; padding:12px; background:#f7971e; border:none; border-radius:8px; color:#fff; font-size:16px; font-weight:700; cursor:pointer; transition:0.3s; }
    .register-box button:hover { background:#e68510; }
    .login-link { text-align:center; margin-top:20px; font-size:14px; color:#555; }
    .login-link a { color:#f7971e; text-decoration:none; font-weight:700; }
    .login-link a:hover { text-decoration:underline; }
  </style>
</head>
<body>

<div class="register-container">
  <div class="register-box">
    <h2>📝 User Register</h2>
    <p>Create your account to order delicious food</p>

    <div id="alertBox"></div>

    <form id="registerForm">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="email" id="email" placeholder="Email Address" required>
      <input type="tel" id="phone" placeholder="Phone Number (e.g. 9876543210)">
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Create Account</button>
    </form>

    <div class="login-link">
      Already have an account? <a href="login.html">Login here</a>
    </div>
    <div class="text-center mt-3">
      <small><a href="index.html" class="text-secondary text-decoration-none">← Back to Home</a></small>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
  document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;
    const password = document.getElementById('password').value;

    const res = registerUser(name, email, password, phone);
    const alertBox = document.getElementById('alertBox');
    if (res.success) {
      alertBox.innerHTML = '<div class="alert alert-success py-2 small">Registration successful! Redirecting to login...</div>';
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1200);
    } else {
      alertBox.innerHTML = `<div class="alert alert-danger py-2 small">${res.message}</div>`;
    }
  });
</script>

</body>
</html>
