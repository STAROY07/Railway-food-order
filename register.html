<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration | Railway Food Order</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
    body { background: linear-gradient(135deg,#0f0c29,#302b63,#24243e); min-height:100vh; display:flex; justify-content:center; align-items:center; padding: 20px; }
    .register-container { background:#fff; padding:35px; border-radius:18px; box-shadow:0 15px 35px rgba(0,0,0,0.3); width:100%; max-width:440px; }
    .logo-badge {
      width: 55px; height: 55px; border-radius: 14px; background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 15px;
    }
    .register-box h2 { text-align:center; color:#1e293b; margin-bottom:6px; font-size:24px; font-weight:700; }
    .register-box p { text-align:center; color:#64748b; margin-bottom:25px; font-size:14px; }
    .btn-submit {
      width:100%; padding:12px; background:linear-gradient(90deg, #3b82f6, #1d4ed8); border:none; border-radius:10px; color:#fff; font-size:15px; font-weight:600; cursor:pointer; transition:0.3s;
    }
    .btn-submit:hover { opacity: 0.95; }
    .login-link { text-align:center; margin-top:20px; font-size:14px; color:#64748b; }
    .login-link a { color:#3b82f6; text-decoration:none; font-weight:600; }
    .login-link a:hover { text-decoration:underline; }
  </style>
</head>
<body>

<div class="register-container">
  <div class="register-box">
    <div class="logo-badge">
      <i class="bi bi-person-plus-fill"></i>
    </div>
    <h2>Passenger Registration</h2>
    <p>Create your account to order food on train</p>

    <div id="alertBox"></div>

    <form id="registerForm">
      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Full Name</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" id="name" class="form-control" placeholder="Enter full name" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" id="email" class="form-control" placeholder="Enter email" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-semibold text-secondary">Mobile Number</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-phone"></i></span>
          <input type="tel" id="phone" class="form-control" placeholder="10-digit mobile number">
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-semibold text-secondary">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-key"></i></span>
          <input type="password" id="password" class="form-control" placeholder="Create password" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <i class="bi bi-check-circle me-1"></i> Create Account
      </button>
    </form>

    <div class="login-link">
      Already have an account? <a href="login.html">Login here</a>
    </div>
    <div class="text-center mt-3">
      <small><a href="index.html" class="text-secondary text-decoration-none">← Back to Home</a></small>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
  document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;
    const password = document.getElementById('password').value;

    const res = registerUser(name, email, password, phone);
    const alertBox = document.getElementById('alertBox');
    if (res.success) {
      alertBox.innerHTML = '<div class="alert alert-success py-2 small">Registration successful! Redirecting to login...</div>';
      setTimeout(() => {
        window.location.href = 'login.html';
      }, 1000);
    } else {
      alertBox.innerHTML = `<div class="alert alert-danger py-2 small">${res.message}</div>`;
    }
  });
</script>

</body>
</html>
