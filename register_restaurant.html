<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Registration | Railway Food Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            padding: 40px 15px;
        }
        .partner-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 620px;
            margin: auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
        }
        .icon-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #fff7ed;
            color: #ea580c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 15px;
        }
    </style>
</head>
<body>

<div class="partner-card">
    <div class="text-center mb-4">
        <div class="icon-circle">
            <i class="bi bi-shop"></i>
        </div>
        <h3 class="fw-bold text-dark">Partner with Railway Food Service</h3>
        <p class="text-muted small">Expand your restaurant reach to thousands of daily railway travelers.</p>
    </div>

    <div id="alertBox"></div>

    <form id="restaurantForm">
        <div class="mb-3">
            <label class="form-label fw-semibold">Restaurant Name</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-shop-window"></i></span>
                <input type="text" id="restName" class="form-control" placeholder="e.g. Royal Bikaner Express" required>
            </div>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label fw-semibold">Owner / Manager Name</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                    <input type="text" id="ownerName" class="form-control" placeholder="Contact Person" required>
                </div>
            </div>
            <div class="col-md-6">
                <label class="form-label fw-semibold">Contact Number</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                    <input type="tel" id="restPhone" class="form-control" placeholder="10-digit Mobile" required>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" id="restEmail" class="form-control" placeholder="business@restaurant.com" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-semibold">Railway Station Covered</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                <select id="restStation" class="form-select" required>
                    <option value="">-- Select Railway Station --</option>
                </select>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold">Cuisine / Specialties</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-egg-fried"></i></span>
                <input type="text" id="restCuisine" class="form-control" placeholder="e.g. North Indian, South Indian, Biryanis, Fast Food" required>
            </div>
        </div>

        <button type="submit" class="btn btn-warning w-100 rounded-pill py-2 fw-bold fs-6">
            <i class="bi bi-check2-circle me-1"></i> Submit Restaurant Partnership Request
        </button>
    </form>

    <div class="text-center mt-3">
        <a href="index.html" class="text-muted text-decoration-none small">← Back to Home</a>
    </div>
</div>

<script src="data.js"></script>
<script>
    const stationSelect = document.getElementById('restStation');
    STATIONS.forEach(st => {
        const opt = document.createElement('option');
        opt.value = st;
        opt.textContent = st;
        stationSelect.appendChild(opt);
    });

    document.getElementById('restaurantForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('restName').value;
        const owner = document.getElementById('ownerName').value;
        const phone = document.getElementById('restPhone').value;
        const email = document.getElementById('restEmail').value;
        const station = document.getElementById('restStation').value;
        const cuisine = document.getElementById('restCuisine').value;

        const restaurants = JSON.parse(localStorage.getItem('rf_restaurants') || '[]');
        restaurants.push({
            id: Date.now(),
            name,
            owner,
            phone,
            email,
            station,
            cuisine,
            status: "Pending Approval"
        });
        localStorage.setItem('rf_restaurants', JSON.stringify(restaurants));

        const alertBox = document.getElementById('alertBox');
        alertBox.innerHTML = '<div class="alert alert-success py-2">Application submitted! Our railway food team will contact you within 24 hours.</div>';
        document.getElementById('restaurantForm').reset();
    });
</script>

</body>
</html>
