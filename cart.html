<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart | Railway Food Order</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --bg-dark: #0b0f19;
    --card-bg: rgba(17, 24, 39, 0.9);
    --border-color: rgba(255, 255, 255, 0.1);
    --accent-orange: #ff6b35;
    --accent-green: #10b981;
}

body {
    background-color: var(--bg-dark);
    background-image: 
        radial-gradient(at 0% 0%, rgba(255, 107, 53, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.15) 0px, transparent 50%);
    background-attachment: fixed;
    font-family: 'Poppins', sans-serif;
    color: #e5e7eb;
    min-height: 100vh;
}

.cart-container {
    max-width: 900px;
    margin: 40px auto;
}

.glass-card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
}

.cart-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 10px;
}

.cart-table th {
    color: #9ca3af;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
    padding: 12px 16px;
    border: none;
}

.cart-row {
    background: rgba(31, 41, 55, 0.6);
    border-radius: 14px;
    transition: all 0.2s ease;
}

.cart-row:hover {
    background: rgba(31, 41, 55, 0.9);
    transform: translateY(-2px);
}

.cart-row td {
    padding: 16px;
    vertical-align: middle;
    border: none;
}

.cart-row td:first-child {
    border-top-left-radius: 12px;
    border-bottom-left-radius: 12px;
}

.cart-row td:last-child {
    border-top-right-radius: 12px;
    border-bottom-right-radius: 12px;
}

.food-title {
    font-weight: 600;
    color: #ffffff;
    margin: 0;
    font-size: 1rem;
}

.price-text {
    font-weight: 500;
    color: #9ca3af;
}

.total-text {
    font-weight: 700;
    color: var(--accent-orange);
    font-size: 1.05rem;
}

.qty-control {
    display: flex;
    align-items: center;
    background: rgba(17, 24, 39, 0.8);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    width: max-content;
    overflow: hidden;
}

.qty-btn {
    background: transparent;
    border: none;
    color: #fff;
    padding: 4px 10px;
    cursor: pointer;
    font-weight: bold;
}
.qty-btn:hover {
    background: rgba(255,255,255,0.1);
}

.qty-display {
    padding: 0 12px;
    font-weight: 600;
    color: #fff;
    font-size: 0.95rem;
}

.btn-remove {
    background: rgba(239, 68, 68, 0.15);
    color: #ef4444;
    border: 1px solid rgba(239, 68, 68, 0.3);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.85rem;
    transition: 0.2s;
    cursor: pointer;
}

.btn-remove:hover {
    background: #ef4444;
    color: white;
}

.checkout-card {
    background: rgba(31, 41, 55, 0.8);
    border-radius: 16px;
    padding: 24px;
    border: 1px solid var(--border-color);
    margin-top: 24px;
}

.btn-checkout {
    background: linear-gradient(135deg, var(--accent-orange), #ea580c);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-weight: 700;
    font-size: 1.1rem;
    width: 100%;
    transition: all 0.3s ease;
    box-shadow: 0 10px 20px rgba(255, 107, 53, 0.3);
    text-decoration: none;
    display: block;
    text-align: center;
}

.btn-checkout:hover {
    transform: translateY(-2px);
    box-shadow: 0 15px 25px rgba(255, 107, 53, 0.4);
    color: white;
}

.btn-continue {
    background: transparent;
    color: #9ca3af;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 12px;
    font-weight: 600;
    width: 100%;
    text-align: center;
    display: block;
    text-decoration: none;
    transition: 0.2s;
}

.btn-continue:hover {
    background: rgba(255, 255, 255, 0.05);
    color: white;
}
</style>
</head>

<body>

<div class="container cart-container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0 text-white">🛒 Your Train Feast</h2>
            <p class="text-muted small mb-0">Review your selected items before checkout</p>
        </div>
        <a href="menu.html" class="btn btn-outline-light btn-sm rounded-pill px-3">+ Add More Food</a>
    </div>

    <div class="glass-card">
        <div id="cartContent">
            <!-- Rendered by JS -->
        </div>
    </div>
</div>

<script src="data.js"></script>
<script>
    requireAuth('login.html');

    function renderCart() {
        const cart = getCart();
        const container = document.getElementById('cartContent');

        if (cart.length === 0) {
            container.innerHTML = `
                <div class="text-center py-5">
                    <div style="font-size: 60px;">🛒</div>
                    <h4 class="mt-3 text-white">Your Cart is Empty</h4>
                    <p class="text-muted">Looks like you haven't added any delicious food items yet.</p>
                    <a href="menu.html" class="btn btn-warning rounded-pill px-4 mt-2">Explore Menu</a>
                </div>
            `;
            return;
        }

        const grandTotal = getCartTotal();

        let tableHtml = `
            <div class="table-responsive">
                <table class="cart-table">
                    <thead>
                        <tr>
                            <th>Item</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Total</th>
                            <th class="text-end">Action</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        cart.forEach(item => {
            const itemTotal = item.price * item.qty;
            tableHtml += `
                <tr class="cart-row">
                    <td>
                        <div class="d-flex align-items-center gap-3">
                            ${item.img ? `<img src="${item.img}" style="width:48px;height:48px;border-radius:8px;object-fit:cover;">` : ''}
                            <h6 class="food-title">${item.name}</h6>
                        </div>
                    </td>
                    <td class="price-text">₹${item.price}</td>
                    <td>
                        <div class="qty-control">
                            <button class="qty-btn" onclick="handleQtyChange('${item.name.replace(/'/g, "\\'")}', ${item.qty - 1})">-</button>
                            <span class="qty-display">${item.qty}</span>
                            <button class="qty-btn" onclick="handleQtyChange('${item.name.replace(/'/g, "\\'")}', ${item.qty + 1})">+</button>
                        </div>
                    </td>
                    <td class="total-text">₹${itemTotal}</td>
                    <td class="text-end">
                        <button class="btn-remove" onclick="handleRemove('${item.name.replace(/'/g, "\\'")}')">Remove</button>
                    </td>
                </tr>
            `;
        });

        tableHtml += `
                    </tbody>
                </table>
            </div>

            <div class="checkout-card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="text-muted">Grand Total</span>
                    <h3 class="fw-bold text-white mb-0">₹${grandTotal}</h3>
                </div>
                <div class="row g-2 mt-2">
                    <div class="col-md-6">
                        <a href="menu.html" class="btn-continue">← Continue Ordering</a>
                    </div>
                    <div class="col-md-6">
                        <a href="checkout.html" class="btn-checkout">Proceed to Checkout 🚆</a>
                    </div>
                </div>
            </div>
        `;

        container.innerHTML = tableHtml;
    }

    function handleQtyChange(name, qty) {
        updateCartQty(name, qty);
        renderCart();
    }

    function handleRemove(name) {
        removeFromCart(name);
        renderCart();
    }

    renderCart();
</script>

</body>
</html>
