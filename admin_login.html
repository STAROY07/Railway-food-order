<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Railway Food Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #0f0e17;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }
        .admin-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .icon-wrap {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            background: rgba(247,151,30,0.2);
            color: #f7971e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 15px;
        }
        .form-control {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.12);
            color: white;
            border-color: #f7971e;
        }
    </style>
</head>
<body>

<div class="admin-card">
    <div class="text-center mb-4">
        <div class="icon-wrap">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h3 class="fw-bold mt-2">Admin Portal</h3>
        <p class="text-white-50 small">Railway Food Management & Control</p>
    </div>

    <div id="alertBox"></div>

    <form id="adminLoginForm">
        <div class="mb-3">
            <label class="form-label text-white-50 small">Admin Email</label>
            <div class="input-group">
                <span class="input-group-text bg-dark text-white border-secondary"><i class="bi bi-person"></i></span>
                <input type="email" id="adminEmail" class="form-control" value="admin@railway.com" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label text-white-50 small">Admin Password</label>
            <div class="input-group">
                <span class="input-group-text bg-dark text-white border-secondary"><i class="bi bi-key"></i></span>
                <input type="password" id="adminPass" class="form-control" value="admin123" required>
            </div>
        </div>

        <button type="submit" class="btn btn-warning w-100 rounded-pill py-2 fw-bold">
            <i class="bi bi-box-arrow-in-right me-1"></i> Login as Admin
        </button>
    </form>

    <div class="text-center mt-4">
        <a href="index.html" class="text-white-50 text-decoration-none small">← Back to Main Website</a>
    </div>
</div>

<script src="data.js"></script>
<script>
    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const email = document.getElementById('adminEmail').value;
        const pass = document.getElementById('adminPass').value;

        if (loginAdmin(email, pass)) {
            document.getElementById('alertBox').innerHTML = '<div class="alert alert-success py-2 small">Authenticated! Opening Admin Dashboard...</div>';
            setTimeout(() => window.location.href = 'admin_dashboard.html', 500);
        } else {
            document.getElementById('alertBox').innerHTML = '<div class="alert alert-danger py-2 small">Invalid Admin Credentials</div>';
        }
    });
</script>

</body>
</html>
