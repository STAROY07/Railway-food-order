<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful | Railway Food Order</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.success-card {
    background: white;
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    max-width: 480px;
    width: 100%;
}
.check-icon {
    width: 75px;
    height: 75px;
    background: #dcfce7;
    color: #16a34a;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    margin: 0 auto 20px;
}
</style>
</head>

<body>

<div class="success-card">
    <div class="check-icon">
        <i class="bi bi-check-lg"></i>
    </div>
    <h3 class="fw-bold text-success">Order Confirmed!</h3>
    <p class="text-muted">Your food is being freshly prepared and will be delivered directly to your train seat.</p>

    <div class="bg-light p-3 rounded-3 text-start my-4">
        <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Order ID:</span>
            <strong id="orderIdText">#000000</strong>
        </div>
        <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Delivery Station:</span>
            <strong id="stationText">-</strong>
        </div>
        <div class="d-flex justify-content-between mb-2">
            <span class="text-muted">Coach / Seat:</span>
            <strong id="seatText">-</strong>
        </div>
        <div class="d-flex justify-content-between">
            <span class="text-muted">Total Paid:</span>
            <strong class="text-success" id="totalText">₹0</strong>
        </div>
    </div>

    <div class="d-grid gap-2">
        <a href="receipt.html" class="btn btn-primary rounded-pill py-2">
            <i class="bi bi-file-earmark-text me-1"></i> View / Print Invoice
        </a>
        <a href="orders.html" class="btn btn-outline-dark rounded-pill py-2">
            <i class="bi bi-box-seam me-1"></i> Track My Order
        </a>
        <a href="dashboard.html" class="btn btn-link text-muted">Back to Dashboard</a>
    </div>
</div>

<script src="data.js"></script>
<script>
    const user = requireAuth('login.html');
    const lastOrder = JSON.parse(sessionStorage.getItem('rf_last_order') || 'null');

    if (lastOrder) {
        document.getElementById('orderIdText').textContent = '#' + lastOrder.id;
        document.getElementById('stationText').textContent = lastOrder.station;
        document.getElementById('seatText').textContent = `${lastOrder.coach} - Seat ${lastOrder.seat_no}`;
        document.getElementById('totalText').textContent = '₹' + lastOrder.total_price;
    }
</script>

</body>
</html>
