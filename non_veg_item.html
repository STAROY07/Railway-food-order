    function renderItems(filter = '') {
        const container = document.getElementById('itemsContainer');
        const q = filter.trim().toLowerCase();
        const filtered = nonvegItems.filter(item => item[0].toLowerCase().includes(q));

        if (filtered.length === 0) {
            container.innerHTML = '<div class="col-12 text-center text-muted py-5"><h4>No dishes found</h4><p>Try searching for a different dish name</p></div>';
            return;
        }

        container.innerHTML = filtered.map((item, idx) => `
            <div class="col-sm-6 col-md-4 col-lg-3">
                <div class="food-card">
                    <img src="${item[2]}" class="food-img" alt="${item[0]}" loading="lazy">
                    <div class="p-3 d-flex flex-column justify-content-between flex-grow-1">
                        <div>
                            <h6 class="fw-bold mb-1 text-dark">${item[0]}</h6>
                            <div class="price-tag mb-2">₹${item[1]}</div>
                        </div>
                        <button onclick="addToCart('${item[0].replace(/'/g, "\\'")}', ${item[1]}, '${item[2]}')" class="btn btn-add-cart w-100 btn-sm py-2">
                            🛒 Add to Cart
                        </button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
        renderItems(e.target.value);
    });

    renderItems();
