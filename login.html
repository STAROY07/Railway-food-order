<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Railway Food Order</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .auth-card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 420px;
      padding: 35px;
    }
    .btn-login {
      background: linear-gradient(90deg, #22c55e, #16a34a);
      color: white;
      border: none;
      font-weight: 600;
      padding: 12px;
      border-radius: 10px;
    }
    .btn-login:hover {
      background: linear-gradient(90deg, #16a34a, #15803d);
      color: white;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="text-center mb-4">
    <div style="font-size: 38px;">🚆</div>
    <h3 class="fw-bold text-dark mt-2">User Login</h3>
    <p class="text-muted small">Access delicious food for your train journey</p>
  </div>

  <div id="alertBox"></div>

  <form id="loginForm">
    <div class="mb-3">
      <label class="form-label fw-semibold">Email Address</label>
      <input type="email" id="email" class="form-control form-control-lg fs-6" placeholder="Enter your email" value="user@example.com" required>
    </div>

    <div class="mb-3">
      <label class="form-label fw-semibold">Password</label>
      <input type="password" id="password" class="form-control form-control-lg fs-6" placeholder="Enter password" value="password123" required>
    </div>

    <button type="submit" class="btn btn-login w-100 mt-2">Login to Account</button>
  </form>

  <div class="text-center mt-4">
    <small class="text-muted">Don't have an account? <a href="register.html" class="fw-bold text-decoration-none text-primary">Register here</a></small>
  </div>
  <div class="text-center mt-2">
    <small class="text-muted"><a href="index.html" class="text-decoration-none text-secondary">← Back to Home</a></small>
  </div>
</div>

<script src="data.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const res = loginUser(email, password);

    const alertBox = document.getElementById('alertBox');
    if (res.success) {
      alertBox.innerHTML = '<div class="alert alert-success py-2 small">Login successful! Redirecting...</div>';
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 600);
    } else {
      alertBox.innerHTML = `<div class="alert alert-danger py-2 small">${res.message}</div>`;
    }
  });
</script>

</body>
</html>
