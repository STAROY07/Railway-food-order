<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | Railway Food Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #f8fafc;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }
        .form-card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            max-width: 580px;
            margin: 40px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        }
        .icon-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #e0f2fe;
            color: #0284c7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            margin: 0 auto 15px;
        }
        .star-rating {
            font-size: 28px;
            cursor: pointer;
            color: #cbd5e1;
        }
        .star-rating i.active {
            color: #f59e0b;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="dashboard.html">
            <i class="bi bi-train-front text-warning"></i> Railway Food Order
        </a>
        <a href="dashboard.html" class="btn btn-outline-light btn-sm rounded-pill">Dashboard</a>
    </div>
</nav>

<div class="container">
    <div class="form-card">
        <div class="text-center mb-4">
            <div class="icon-circle">
                <i class="bi bi-chat-quote-fill"></i>
            </div>
            <h4 class="fw-bold text-primary">Passenger Journey Feedback</h4>
            <p class="text-muted small">How was your train meal experience? We'd love to hear from you!</p>
        </div>

        <div id="alertBox"></div>

        <form id="feedbackForm">
            <div class="mb-3 text-center">
                <label class="form-label fw-semibold d-block">Your Rating</label>
                <div class="star-rating" id="starContainer">
                    <i class="bi bi-star-fill active" data-val="1"></i>
                    <i class="bi bi-star-fill active" data-val="2"></i>
                    <i class="bi bi-star-fill active" data-val="3"></i>
                    <i class="bi bi-star-fill active" data-val="4"></i>
                    <i class="bi bi-star-fill active" data-val="5"></i>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold">Your Review & Comments</label>
                <textarea id="feedbackMsg" rows="4" class="form-control" placeholder="Share your experience regarding food taste, packaging and delivery speed..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">
                <i class="bi bi-send-check me-1"></i> Submit Feedback
            </button>
        </form>
    </div>
</div>

<script src="data.js"></script>
<script>
    const user = requireAuth('login.html');
    let currentRating = 5;

    const stars = document.querySelectorAll('#starContainer i');
    stars.forEach(star => {
        star.addEventListener('click', () => {
            currentRating = Number(star.getAttribute('data-val'));
            stars.forEach(s => {
                s.classList.toggle('active', Number(s.getAttribute('data-val')) <= currentRating);
            });
        });
    });

    document.getElementById('feedbackForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const msg = document.getElementById('feedbackMsg').value;

        const feedbacks = JSON.parse(localStorage.getItem('rf_feedback') || '[]');
        feedbacks.unshift({
            id: Date.now(),
            user_email: user.email,
            name: user.name || 'Passenger',
            rating: currentRating,
            message: msg,
            created_at: new Date().toLocaleString()
        });
        localStorage.setItem('rf_feedback', JSON.stringify(feedbacks));

        const alertBox = document.getElementById('alertBox');
        alertBox.innerHTML = '<div class="alert alert-success py-2">Thank you! Your review has been submitted successfully.</div>';
        document.getElementById('feedbackMsg').value = '';
    });
</script>

</body>
</html>
